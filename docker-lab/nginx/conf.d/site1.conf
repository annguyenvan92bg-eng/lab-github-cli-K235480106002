server {
    listen 80;
    server_name web1.anxper.id.vn;

    root /usr/share/nginx/html/site1;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    }
}
